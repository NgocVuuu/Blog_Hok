name: Weekly HoK News Sync

on:
  schedule:
    # 6:00 AM VN Time (Friday) = 23:00 UTC (Thursday)
    - cron: '0 23 * * 4'
  workflow_dispatch: # Allow manual trigger button

jobs:
  sync-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/server/package-lock.json

    - name: Install Dependencies
      working-directory: ./apps/server
      run: npm ci

    - name: Run News Scraper
      working-directory: ./apps/server
      env:
        # DB Connection
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        
        # Logging level
        LOG_LEVEL: info
      run: npm run sync-news
