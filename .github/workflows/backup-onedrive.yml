name: Weekly OneDrive Backup

on:
  schedule:
    # 5:00 AM VN Time (Friday) = 22:00 UTC (Thursday)
    - cron: '0 22 * * 4'
  workflow_dispatch:

jobs:
  backup-to-onedrive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install MongoDB Tools to get 'mongodump'
      - name: Install MongoDB Tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-tools

      # 2. Create Backup File (Compressed)
      - name: Create Backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M')
          FILENAME="hok-backup-$TIMESTAMP.archive.gz"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # Dump specific database from URI connection string
          mongodump --uri="$MONGODB_URI" --archive="$FILENAME" --gzip

      # 3. Setup Rclone (Manual Install)
      - name: Setup Rclone
        run: |
          # Install Rclone
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          
          # Create Config safely using 'config create' command
          # This avoids JSON parsing errors from direct file writing
          rclone config create onedrive onedrive \
            token '${{ secrets.RCLONE_CONFIG }}' \
            drive_type business

      # 4. Upload to OneDrive
      - name: Upload to OneDrive
        run: |
          # Copy the backup file to your OneDrive folder
          # Format: rclone copy <source> <remote_name>:<remote_path>
          rclone copy "$FILENAME" "onedrive:/BlogHok/Backups/"
          
          echo "✅ Backup uploaded to OneDrive: /BlogHok/Backups/$FILENAME"
