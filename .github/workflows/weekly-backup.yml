name: Weekly Backup

on:
  schedule:
    # Runs at 22:00 UTC Thursday (05:00 AM Friday VN)
    - cron: '0 22 * * 4'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        cd apps/server
        npm ci

    - name: Run Backup Script
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        cd apps/server
        node scripts/backupData.js

    - name: Commit and Push Backup
      run: |
        git config --global user.name 'HoK Backup Bot'
        git config --global user.email 'backup-bot@users.noreply.github.com'
        git add apps/server/backups/*.json
        git commit -m "Auto-Backup: $(date -u)" || echo "No changes to commit"
        git push origin HEAD:main
