# Sample wrangler.toml for Cloudflare Worker (next-on-pages output)
# Replace account_id with your Cloudflare account ID before deploying.
name = "blog-hok-client-next"
account_id = "REPLACE_WITH_YOUR_ACCOUNT_ID"
compatibility_date = "2025-11-04"
# Use `javascript` type for the worker bundle produced by next-on-pages
type = "javascript"

# You can add routes or workers_dev = true depending on how you deploy
workers_dev = true

[build]
  command = "npm run build:cloudflare"
  cwd = "./"

# Uncomment and set zone_id/route if you want to publish to a specific route
# zone_id = "YOUR_ZONE_ID"
# route = "example.com/*"

# When using Cloudflare Pages, Pages expects a `pages_build_output_dir` property
# that points to the output directory created by the Next adapter. Setting this
# makes the file valid for Pages integrations. Adjust if your adapter writes to
# a different directory.
pages_build_output_dir = ".vercel/output"
